<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For you</title>
    <!-- Beautiful Warm Serif Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="cover-page" class="page">
        <!-- Title with warm aesthetics -->
        <h1 class="main-title">
            <span class="title-line">✨💖🥹Happy</span>
            <span class="title-line">Belated Anniversary</span>
            <span class="title-line">Penguin 🐧💕✨</span>
        </h1>

        <!-- Envelope Container -->
        <div class="envelope-container">
            <img src="envelope.jpeg" alt="Envelope" class="envelope-img" id="envelope-btn">
        </div>

        <!-- Arrow pointing UPWARDS -->
        <div class="tap-prompt">
            <span class="arrow">↑</span>
            <p>Tap envelope to open</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
